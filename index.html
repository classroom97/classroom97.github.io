<style>
    body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at center, #0a0a0a, #000);
        display: flex;
        align-items: center;
        justify-content: center;

    }

    .box {

        color: white;
    }

    input {
        width: 300px;
        padding: 12px;
        font-size: 16px;
        border: none;
        outline: none;

    }

        margin-top: 10px;

<body>

<div class="box">
    <h1>CLASSROOM 97</h1>
    <input id="entry" type="text" placeholder="Enter to continue..." />
    <div class="hint">Type anything to enter</div>
</div>

<script>
    const input = document.getElementById("entry");

    input.addEventListener("input", () => {
        if (input.value.trim().length > 0) {
            window.location.href = "https://sites.google.com/view/classroom97";
        }
    });
</script>
